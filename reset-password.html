<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Arena System</title>
    <meta name="description" content="Reset your Arena System account password securely.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/authpage.css">
    <link rel="stylesheet" href="styles/animations.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
    window.__ENV__ = {
        SUPABASE_URL:  'https://YOUR_PROJECT.supabase.co',
        SUPABASE_ANON: 'YOUR_ANON_KEY',
        API_BASE:      'https://YOUR_PROJECT.supabase.co/functions/v1/api/v1'
    };
    </script>
    <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    .ap-alert { display:none; align-items:center; gap:10px; padding:12px 16px; border-radius:10px; font-size:.85rem; font-weight:500; margin-top:14px; }
    .ap-alert.error   { background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.3); color:#fca5a5; }
    .ap-alert.success { background:rgba(34,197,94,.12); border:1px solid rgba(34,197,94,.3);  color:#86efac; }
    </style>
</head>
<body class="authpage-body">
    <canvas id="stars-canvas" style="position:fixed;inset:0;z-index:0;pointer-events:none"></canvas>
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-grid"></div>

    <div class="authpage-topbar">
        Hosting &amp; AntiDDOS by <a href="https://discord.gg/heGNN7Cymz" target="_blank">Arena System</a>
        &nbsp;·&nbsp; <span style="color:#22c55e;font-weight:700">● 99.99% Uptime</span>
    </div>

    <nav class="authpage-nav">
        <a href="/" class="authpage-logo">
            <div class="logo-icon">AS</div>
            Arena System
        </a>
        <div class="authpage-nav-right">
            <a href="login.html" class="ap-nav-btn">Sign In</a>
        </div>
    </nav>

    <main class="authpage-main" style="min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:40px 20px">
        <div class="ap-card" style="max-width:440px;width:100%">
            <div style="text-align:center;margin-bottom:28px">
                <div style="width:60px;height:60px;border-radius:16px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                    <i class="fas fa-key" style="font-size:1.5rem;color:#22c55e"></i>
                </div>
                <h2 style="font-size:1.5rem;font-weight:800;color:#fff;margin:0">Reset Password</h2>
                <p style="color:#6b7280;font-size:.88rem;margin-top:8px">Enter your email and we'll send a reset link</p>
            </div>

            <form id="resetForm" novalidate>
                <div class="ap-form-group">
                    <label class="ap-label" for="resetEmail">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <div class="ap-input-wrap">
                        <input type="email" id="resetEmail" name="email" class="ap-input" placeholder="your@email.com" autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" id="resetBtn" class="ap-submit-btn" style="background:linear-gradient(135deg,#22c55e,#16a34a) !important;color:#ffffff !important;font-weight:800;font-size:1rem;padding:14px;border-radius:10px;box-shadow:0 4px 20px rgba(34,197,94,0.4);border:none;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px">
                    <span class="btn-text"><i class="fas fa-paper-plane"></i> Send Reset Link</span>
                    <span class="btn-spinner" style="display:none"><i class="fas fa-circle-notch fa-spin"></i></span>
                </button>
            </form>

            <div id="resetAlert" class="ap-alert"></div>

            <div style="text-align:center;margin-top:20px;font-size:.78rem;color:#555">
                Remembered it?
                <a href="login.html" style="color:#4ade80;text-decoration:none;font-weight:700">Back to Login</a>
            </div>
        </div>
    </main>

    <footer style="border-top:1px solid rgba(34,197,94,0.12);padding:18px 36px;text-align:center;color:#44445a;font-size:.78rem;font-family:'JetBrains Mono',monospace">
        © 2026 Arena System. All Rights Reserved.
    </footer>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth-supabase.js"></script>
    <script>
    (function(){const canvas=document.getElementById('stars-canvas');if(!canvas)return;const ctx=canvas.getContext('2d');let stars=[];function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}resize();window.addEventListener('resize',resize,{passive:true});for(let i=0;i<70;i++)stars.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*1.5+0.3,alpha:Math.random(),speed:Math.random()*0.015+0.004});function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);stars.forEach(s=>{s.alpha+=s.speed;if(s.alpha>1||s.alpha<0)s.speed=-s.speed;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(251,146,60,${Math.abs(s.alpha)*0.6})`;ctx.shadowBlur=6;ctx.shadowColor='#22c55e';ctx.fill();});requestAnimationFrame(draw);}draw();})();
    </script>
</body>
</html>
